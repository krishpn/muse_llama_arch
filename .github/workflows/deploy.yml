name: DevSecOps CI/CD Pipeline

# Trigger the workflow automatically on pushes to staging and main branches
on:
  push:
    branches:
      - staging
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out repository source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Determine Target Environment and Map Correct File Names
      # Dynamically sets environment variables based on the active branch (main vs. staging)
      - name: Set Environment Context
        id: env-context
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "HELM_VALUES=values.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=production" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "HELM_VALUES=override-values.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          fi

      # 2. Build & Test Stage
      # Executes unit tests and static application security testing (SAST) prior to validation
      - name: Run Tests & SAST Scanning
        run: |
          echo "Running SAST analysis and unit tests for target env: ${{ env.ENVIRONMENT }}"
          # pytest apps/nkepsx/

      # 3. Validate Helm Template & Values (Cluster-Free E2E Test)
      # Parses the Helm chart, templates, values, and secret overrides locally on the runner
      # to ensure complete structural correctness without needing a live Kubernetes cluster.
      - name: Validate Helm Template & Values
        run: |
          echo "Validating Helm configuration for namespace: ${{ env.NAMESPACE }} using values file: ${{ env.HELM_VALUES }}"
          helm template nkepsx ./helm/nkepsx \
            --namespace ${{ env.NAMESPACE }} \
            -f ./helm/nkepsx/${{ env.HELM_VALUES }} \
            -f ./helm/nkepsx/override-secrets.yaml \
            --debug