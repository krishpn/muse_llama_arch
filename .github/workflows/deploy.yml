name: DevSecOps CI/CD Pipeline

# Trigger the workflow automatically on pushes to staging and main branches
on:
  push:
    branches:
      - staging
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out repository source code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Determine Target Environment and Map Correct File Names
      - name: Set Environment Context
        id: env-context
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "HELM_VALUES=values.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=production" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "HELM_VALUES=override-values.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=staging" >> $GITHUB_ENV
          fi

      # 2. Setup uv & Python Environment
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Dynamic Multi-Project Build & Test
      - name: Run Tests & SAST Scanning
        run: |
          echo "Running SAST analysis and unit tests for target env: ${{ env.ENVIRONMENT }}"
          ROOT_DIR=$(pwd)

          # Find subdirectories containing pyproject.toml (depth 1 to 3)
          PROJECT_DIRS=$(find . -mindepth 1 -maxdepth 3 -name "pyproject.toml" -exec dirname {} \;)

          if [ -z "$PROJECT_DIRS" ]; then
            echo "No pyproject.toml files found in workspace subdirectories."
            exit 1
          fi

          # Loop dynamically through each discovered project directory
          for dir in $PROJECT_DIRS; do
            echo "=================================================="
            echo "Processing project in: $dir"
            echo "=================================================="
            
            cd "$ROOT_DIR/$dir"

            # Create venv for the subproject
            uv venv

            # Sync project dependencies
            if [ -f "uv.lock" ]; then
              uv sync --extra dev
            else
              uv pip install -e ".[dev]"
            fi

            # Run tests if tests directory exists
            if [ -d "tests" ]; then
              echo "Running tests in $dir..."
              uv run pytest tests/
            else
              echo "No tests directory found in $dir, skipping pytest."
            fi

            # Verify wheel/sdist build
            echo "Verifying build for $dir..."
            uv build

            cd "$ROOT_DIR"
          done

      # 4. Validate Helm Template & Values
      - name: Validate Helm Template & Values
        run: |
          echo "Validating Helm configuration for namespace: ${{ env.NAMESPACE }} using values file: ${{ env.HELM_VALUES }}"
          helm template nkepsx ./helm/nkepsx \
            --namespace ${{ env.NAMESPACE }} \
            -f ./helm/nkepsx/${{ env.HELM_VALUES }} \
            -f ./helm/nkepsx/override-secrets.yaml \
            --debug