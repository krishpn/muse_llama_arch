[project]
name = "open-aether"
version = "0.1.0"
description = "Applied Causal Inference and Network Interference Benchmarking"
readme = "README.md"
authors = [
    { name = "Krishna Neupane" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"