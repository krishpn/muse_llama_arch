# Baseline real-data validation experiment (design doc Sec 8/12).
# Loaded by run_real_experiment.py via --config (defaults here if --config is omitted).
training:
  # kl_free_bits is now the MEAN per-(node, period) KL floor (train.py's _categorical_kl
  # means over nodes, train_step/_forward_pass_components mean again over periods), so
  # 0.05 means the same thing regardless of this panel's N/T -- it no longer scales with
  # panel size the way the pre-fix summed version did. The epoch-300ish collapse/plateau
  # numbers previously noted here were measured under that old sum-based aggregation and
  # no longer apply at the new (much smaller) absolute KL scale; re-run and re-check
  # components_trend before assuming epochs/kl_beta_max/kl_warmup_epochs below are still
  # well-tuned.
  epochs: 500
  eval_every: 25
  lr: 0.01
  kl_beta_max: 0.15
  kl_warmup_epochs: 300
  kl_free_bits: 0.05
  lambda_mi: 0.05
  lambda_smooth: 0.05
model:
  hidden_dim: 16
  decoder_hidden_dim: 16
  num_blocks: 2
kappa: 0.05
seed: 0
