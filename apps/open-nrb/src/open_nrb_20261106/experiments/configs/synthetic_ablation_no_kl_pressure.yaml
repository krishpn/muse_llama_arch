# Decoder-identifiability check (design doc Sec 10, 2026-11-01 "Not yet done" item): does the
# real-data finding that W_hat is ~insensitive to the z/block posterior (rel diff 1.5e-5 between
# a one-block-collapsed run and a near-uniform run) also hold on synthetic data, where
# total_recon is nonzero and should give the decoder a real training signal? Everything here
# matches sweep_lambda_mi_0.yaml (the current lambda_mi=0 tuning decision) except kl_beta_max=0,
# mirroring ablation_no_kl_pressure.yaml's real-data ablation -- pair this config's seed_0.pt
# against sweep_lambda_mi_0.yaml's seed_0.pt and diff W_hat the same way as the real-data check.
training:
  epochs: 3000
  eval_every: 200
  lr: 0.01
  kl_beta_max: 0.0
  kl_warmup_epochs: 300
  kl_free_bits: 0.05
  lambda_mi: 0.0
  lambda_smooth: 0.05
model:
  hidden_dim: 16
  decoder_hidden_dim: 16
  num_blocks: 2
scenario:
  n_banks: 24
  n_periods: 16
  covariate_dim: 5
  pi: [0.3, 0.7]
  lambda_matrix: [[2.5, 0.6], [0.6, 0.2]]
  eta_block: [[2.0, 0.0], [0.0, -2.0]]
  w: [0.05, 0.8, 0.5, -0.3, 0.4]
  sigma2: 0.15
  cap: 6.0
seeds: [0]
