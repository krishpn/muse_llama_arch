# Robustness config for open_nrb_causal/run_causal_experiment.py -- identical to
# baseline.yaml except post_window_end. audit_bs_extraction.py (2026-11-03): every bulletin
# Baisakh 2070 - Falgun 2075 passes the liabilities/asset identities (96-100%), corruption
# starts with Chaitra 2075, so this run keeps only clean files (design doc Sec 5a). A sample
# restriction, not a data repair. See baseline.yaml for the meaning of each field.
artifact_path: src/open_nrb/results/baseline/real_run_seed0.pt
csv_path: src/open_nrb/data/processed/monthly_statistical_bfis/nrb_balance_sheet.csv
pnl_csv_path: src/open_nrb/data/processed/monthly_statistical_bfis/nrb_profit_and_loss.csv
capital_floor: 0.04
paid_up_capital_requirement: 8000
pre_window_end: [2072, "Mangsir"]
effective_period: [2073, "Asar"]
post_window_end: [2075, "Falgun"]
pnl_ytd_cumulative: true
blank_as_zero: [loan_written_off]
outcome_construction: monthly
weighting: unweighted
n_bootstrap: 9999
bootstrap_seed: 0
rdd_bandwidth: 0.02
rdd_window: [[2073, "Shrawan"], [2075, "Asar"]]
